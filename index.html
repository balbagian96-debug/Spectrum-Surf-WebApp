<style>
/* Layout: one phone-width column (max 480px), five screens behind a fixed bottom tab bar, ocean-navy ground that takes each wave's tint on Surf and detail pages. */
:root {
  --ocean: #051630;
  --deep: #0a2a52;
  --aqua: #3dd9e8;
  --aqua-dk: #04425f;
  --sun: #ffc83d;
  --sun-dk: #7a3e06;
  --coral: #ff6b5e;
  --coral-dk: #7a1c20;
  --foam: #eaf8ff;
  --mist: #9fc3da;
  --card: rgba(255, 255, 255, 0.07);
  --line: rgba(160, 215, 240, 0.22);
  --wave: #3dd9e8;
  --bg: #051630;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: auto; }

  margin: 0;
  background: var(--bg);
  color: var(--foam);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  transition: background-color 0.45s ease;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 0;
}
#app { max-width: 480px; margin: 0 auto; padding-bottom: 112px; min-height: 80vh; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--foam); outline-offset: 3px; border-radius: 12px; }

/* glossy cartoon buttons */
.btn {
  display: block; width: 100%; border: 0; border-radius: 999px; padding: 15px 22px 17px;
  font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.04em; text-transform: uppercase;
  color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  background: linear-gradient(180deg, #9ff5f0 0%, #27c0dc 55%, #14a9cd 100%);
  box-shadow: 0 7px 0 var(--aqua-dk), 0 14px 18px rgba(0, 0, 0, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.55);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--aqua-dk), 0 6px 10px rgba(0, 0, 0, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.55); }
.btn.sun { background: linear-gradient(180deg, #ffec8a 0%, #ffc83d 55%, #f4a41f 100%); box-shadow: 0 7px 0 var(--sun-dk), 0 14px 18px rgba(0, 0, 0, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.6); }
.btn.sun:active { box-shadow: 0 2px 0 var(--sun-dk), 0 6px 10px rgba(0, 0, 0, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.6); }
.btn.coral { background: linear-gradient(180deg, #ffb09c 0%, #ff6b5e 55%, #ec4a44 100%); box-shadow: 0 7px 0 var(--coral-dk), 0 14px 18px rgba(0, 0, 0, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.5); }

.btn.small { width: auto; padding: 10px 18px 12px; font-size: 1rem; }
.btn[disabled] { opacity: 0.35; pointer-events: none; }
.stack { display: grid; gap: 22px; }
.row { display: flex; gap: 14px; }
.row > * { flex: 1; min-width: 0; }

/* banner */
.banner { text-align: center; padding: 14px 0 6px; }
.banner h1 { font-size: clamp(1.9rem, 8vw, 2.5rem); color: #fff; text-shadow: 0 3px 0 #02284a, 0 0 18px rgba(61, 217, 232, 0.35); }

.sea-a { animation: drift 7s linear infinite; }
.sea-b { animation: drift 11s linear infinite reverse; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }

/* home */
.logo { display: block; width: min(78%, 330px); margin: 10px auto 0; }
.tagline { text-align: center; color: var(--mist); font-weight: 700; font-size: 1.05rem; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; text-align: center; border-bottom: 5px solid var(--wave); }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--aqua); }

/* spectrum strip */
.strip { position: relative; height: 16px; border-radius: 999px; background: linear-gradient(90deg, #ff4d5a, #ff9a3c, #ffd23f, #3ddc84, #4d8dff, #a65cff, #f23fe0); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.3); }
.strip i { position: absolute; top: -6px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; background: #fff; border: 4px solid var(--wave); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45); transition: left 0.25s ease, border-color 0.25s ease; }
.ends { display: flex; justify-content: space-between; gap: 12px; font-size: 0.8rem; color: var(--mist); font-weight: 700; margin-top: 8px; }

/* surf */
.bar { height: 12px; border-radius: 999px; background: var(--wave); transition: background-color 0.3s ease; }
.surf-name { font-size: clamp(2rem, 9vw, 2.6rem); color: var(--wave); text-align: center; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.surf-desc { text-align: center; min-height: 4.6em; font-size: 1.05rem; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 16px; border-radius: 999px; background: linear-gradient(90deg, #ff4d5a, #ff9a3c, #ffd23f, #3ddc84, #4d8dff, #a65cff, #f23fe0); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35); }
input[type="range"]::-moz-range-track { height: 16px; border-radius: 999px; background: linear-gradient(90deg, #ff4d5a, #ff9a3c, #ffd23f, #3ddc84, #4d8dff, #a65cff, #f23fe0); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; margin-top: -12px; border-radius: 50%; background: #fff; border: 6px solid var(--wave); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 6px solid var(--wave); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
.hint { text-align: center; color: var(--mist); font-size: 0.9rem; font-weight: 700; }

/* detail */
.topbar { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
.back { width: 52px; height: 52px; flex: none; border: 0; border-radius: 50%; background: linear-gradient(180deg, #ffb09c, #ff6b5e 60%, #ec4a44); box-shadow: 0 5px 0 var(--coral-dk), inset 0 3px 0 rgba(255, 255, 255, 0.5); display: grid; place-items: center; }
.back svg { width: 24px; height: 24px; }
.detail-name { font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--wave); }
.copy p + p { margin-top: 0.8em; }
.copy { font-size: 1.05rem; }
.sec h3 { color: var(--wave); font-size: 1.5rem; margin-bottom: 8px; }
.sec ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.sec li { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--wave); border-radius: 14px; padding: 12px 14px; }
.sec li b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.sec li span { color: #d7ecf8; }

/* order quiz */
.lead { text-align: center; color: var(--mist); font-weight: 700; }
.prog { text-align: center; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.feed { text-align: center; min-height: 1.6em; color: var(--aqua); font-weight: 800; }
.feed.bad { color: #ffb3a8; }
.pills { display: grid; gap: 14px; }
.pill {
  border: 0; border-radius: 999px; padding: 13px 20px 15px; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.05em; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 70%);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 30%, #000), inset 0 3px 0 rgba(255, 255, 255, 0.45);
  text-shadow: 0 2px 0 color-mix(in srgb, var(--c) 25%, #000);
  transition: transform 0.12s ease;
}
.pill:active { transform: translateY(4px); }
.pill.gone { display: none; }

/* play */
.topics { display: grid; gap: 14px; }
.topic { text-align: left; border: 1px solid var(--line); border-radius: 18px; background: var(--card); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.topic b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; display: block; }
.topic span { color: var(--mist); font-size: 0.9rem; }
.topic .go { margin-left: auto; width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--aqua); color: var(--aqua-dk); display: grid; place-items: center; font-weight: 800; }
.qcount { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-display); color: var(--aqua); font-weight: 600; }
.meter { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--aqua), var(--sun)); border-radius: 999px; transition: width 0.3s ease; }
.qtext { font-family: var(--font-display); font-size: 1.35rem; font-weight: 500; line-height: 1.3; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; border: 2px solid var(--line); border-radius: 16px; background: var(--card); padding: 13px 16px; font-weight: 700; }
.choice.ok { border-color: #3ddc84; background: rgba(61, 220, 132, 0.18); }
.choice.no { border-color: var(--coral); background: rgba(255, 107, 94, 0.18); }
.choice[disabled] { cursor: default; }
.explain { border-radius: 14px; background: rgba(61, 217, 232, 0.12); border: 1px solid var(--line); padding: 12px 14px; }
.score { text-align: center; }
.score .big { font-family: var(--font-display); font-size: 3.4rem; font-weight: 700; color: var(--sun); }
.ext { text-align: center; font-size: 0.92rem; color: var(--mist); }
.ext a { color: var(--aqua); font-weight: 800; }

/* about */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.card h2 { color: var(--aqua); font-size: 1.5rem; margin-bottom: 8px; }
.legend { display: grid; gap: 8px; margin-top: 12px; }
.legend div { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.legend i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.credit { text-align: center; color: var(--mist); font-size: 0.9rem; font-weight: 700; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: linear-gradient(180deg, rgba(5, 22, 48, 0.88), rgba(4, 16, 36, 0.98));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tab { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); border-radius: 18px; padding: 7px 2px 6px; display: grid; justify-items: center; gap: 2px; color: var(--mist); font-family: var(--font-display); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.06em; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: #fff; border-color: #0a5d80; background: linear-gradient(180deg, #8cf0ee, #1aa9cd); box-shadow: 0 4px 0 var(--aqua-dk); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
@media (max-width: 380px) { .tab { font-size: 0.6rem; } .tab svg { width: 22px; height: 22px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* quiz run */
.runhud { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.runhud .hearts { color: #ff6b5e; letter-spacing: 0.12em; }
.runhud .st { color: var(--aqua); }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { border-radius: 14px; padding: 8px 8px 10px; font-weight: 800; font-size: 0.85rem; line-height: 1.2; color: #fff; text-align: center; min-width: 0; overflow-wrap: anywhere; background: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 40%, #000); transition: opacity 0.2s ease; }
.chip b { display: block; font-family: var(--font-display); font-size: 1.1rem; }
.chip.dead { opacity: 0.25; text-decoration: line-through; }
.stage { position: relative; }
.stage canvas { display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; touch-action: pan-y; background: #0a2a52; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3); }
.ov { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 20px; border-radius: 22px; background: rgba(5, 22, 48, 0.8); }
.ov[hidden] { display: none; }
.stage.tall canvas { aspect-ratio: 4 / 5; }
.vfx { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; }
.vfx.hit { opacity: 1; transition: none; box-shadow: inset 0 0 90px 24px rgba(255, 60, 50, 0.75); }
.vfx.good { opacity: 1; transition: none; box-shadow: inset 0 0 80px 18px rgba(61, 220, 132, 0.55); }
.ov h2 { font-size: 2rem; color: #fff; }
.ov p { color: var(--foam); max-width: 30ch; }
.ov .big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--sun); line-height: 1; }
.ov .btn { width: auto; min-width: 190px; }
.msg { min-height: 3.2em; border-radius: 14px; background: rgba(61, 217, 232, 0.12); border: 1px solid var(--line); padding: 10px 14px; font-size: 0.95rem; }
.msg.bad { background: rgba(255, 107, 94, 0.14); }
.kit { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
.dev { position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--c); background: rgba(255, 255, 255, 0.06); color: var(--c); display: grid; place-items: center; padding: 0; }
.dev svg { width: 62%; height: 62%; }
.dev .n { position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: #fff; color: #051630; border: 2px solid var(--c); font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; display: grid; place-items: center; }
.dev:not([disabled]) { box-shadow: 0 0 14px color-mix(in srgb, var(--c) 55%, transparent); }
.dev[disabled] { opacity: 0.3; cursor: default; }
.devs { display: grid; gap: 10px; }
.devcard { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 14px; padding: 11px 12px; }
.devcard .di { width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--c); color: var(--c); display: grid; place-items: center; }
.devcard .di svg { width: 28px; height: 28px; }
.devcard b { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; display: block; }
.devcard .wv { color: var(--c); font-weight: 800; font-size: 0.82rem; display: block; }
.devcard p { color: #d7ecf8; font-size: 0.92rem; margin-top: 2px; }

/* ===== PIXEL BEACH THEME (overrides) ===== */
:root {
  --ink: #2b1a0f; --cream: #fff4d6; --cream-dk: #e9d3a0; --brown: #7a3e06;
  --sky: #78c0f4; --yellow: #ffd23f; --orange: #ff9a3c; --blue: #3d9bff; --navy: #123a7a;
  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "Pixelify Sans", "Courier New", monospace;
  --clip: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px));
  --outline: 3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 6px 6px 0 rgba(0,0,0,.28);
  --card: var(--cream); --line: var(--ink); --foam: #fff; --mist: #fff; --aqua: #1b6fb8;
}
#beach { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; display: block; }
body { background: var(--sky); font-size: 18px; line-height: 1.35; letter-spacing: 0.01em; color: #fff; }
#app { position: relative; z-index: 1; }
h1, h2, h3 { font-weight: 400; line-height: 1.35; }
:focus-visible { outline: 4px solid #fff; outline-offset: 2px; border-radius: 0; }

/* pixel panels */
.day, .card, .explain, .msg, .copy, .surf-desc, .qtext, .sec li, .topic, .choice, .devcard, .ends-panel {
  background: var(--cream); color: var(--ink); border: 0; border-radius: 0; clip-path: var(--clip);
  box-shadow: inset 0 0 0 4px var(--ink), inset 0 0 0 8px var(--cream), inset 0 0 0 10px var(--cream-dk);
  padding: 20px 22px;
}
.copy, .surf-desc, .qtext, .day, .card { padding: 22px 24px; }
.sec li { padding: 16px 18px 16px 24px; border-left: 0; }
.sec li b, .topic b, .devcard b { color: var(--ink); font-size: 0.78rem; font-family: var(--font-display); line-height: 1.5; }
.sec li span, .devcard p, .topic span, .copy, .explain, .msg { color: #4a3220; }
.devcard .wv { color: color-mix(in srgb, var(--c) 55%, var(--ink)); font-family: var(--font-display); font-size: 0.55rem; }
.day h2, .card h2, .score .big { color: color-mix(in srgb, var(--wave) 55%, var(--ink)); font-size: 1.05rem; text-shadow: none; }
.score .big { font-size: 2.4rem; }
.day .eyebrow { color: var(--brown); text-shadow: none; }
.day p, .card p, .explain, .score p { color: #4a3220; text-shadow: none; }
.eyebrow { text-shadow: 2px 2px 0 var(--ink) !important; }
.day .eyebrow { text-shadow: none !important; }
.surf-desc { min-height: 5.6em; font-size: 1.1rem; text-align: left; }
.copy { font-size: 1.1rem; }
.qtext { font-family: var(--font-body); font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
.qcount { color: #fff; text-shadow: var(--outline); font-size: 0.65rem; }

/* outlined text on the scene */
.banner h1, .surf-name, .detail-name, .sec h3, .tagline, .lead, .hint, .prog, .feed, .ext, .credit, .ends, .eyebrow, .runhud, .ov h2, .ov p, .ov .big, .ptitle span {
  text-shadow: var(--outline);
}
.tagline, .lead, .hint, .prog, .feed, .ext, .credit { color: #fff; font-size: 1.1rem; font-weight: 500; }
.feed { color: #fff; } .feed.bad { color: #ffd0c8; }
.ext a { color: var(--yellow); }
.eyebrow { font-family: var(--font-display); font-size: 0.6rem; color: #fff; letter-spacing: 0.08em; }
.ends { color: #fff; font-size: 1rem; }
.banner h1 { font-size: clamp(1.1rem, 5.6vw, 1.6rem); color: var(--yellow); }
.surf-name { font-size: clamp(1.1rem, 6vw, 1.6rem); color: var(--wave); text-align: center; }
.detail-name { font-size: clamp(1rem, 5.2vw, 1.4rem); color: var(--wave); }
.sec h3 { color: var(--yellow); font-size: 0.95rem; }
.runhud .st { color: #fff; } .runhud { font-size: 0.7rem; }

/* pixel wave divider */
.banner svg { display: none; }
.banner::after { content: ""; display: block; height: 16px; margin-top: 10px; background-color: #1b78d0;

ecomes radioactive", "The water in the food freezes", "Water in the food absorbs the microwaves and heats up", "A flame cooks the outside"], "correct": 3, "explain": "Microwaves make the water in food heat up, and the heat spreads through the rest of the food."}, {"text": "Which has the higher frequency?", "choices": ["Radio waves", "They are exactly equal", "Neither one has a frequency", "Microwaves"], "correct": 4, "explain": "Microwaves have shorter wavelengths than radio waves, so their frequency is higher."}, {"text": "A radio wave has a frequency of 100 MHz (1 x 10^8 Hz). What is its wavelength? Use c = 3 x 10^8 m/s.", "choices": ["0.3 m", "3 m", "30 m", "300 m"], "correct": 2, "explain": "Wavelength = c / f = (3 x 10^8) / (1 x 10^8) = 3 m."}, {"text": "What is the unit of frequency?", "choices": ["Hertz (Hz)", "Watt (W)", "Newton (N)", "Meter (m)"], "correct": 1, "explain": "One hertz means one wave cycle every second."}, {"text": "Why can radio waves pass through walls and buildings so easily?", "choices": ["They are extremely hot", "They are the fastest EM waves", "They are made of sound", "They have long wavelengths and low energy"], "correct": 4, "explain": "Long-wavelength, low-energy waves are not absorbed much by walls, so signals can reach inside buildings."}, {"text": "Which list goes from longest to shortest wavelength?", "choices": ["Radio, microwave, infrared", "Radio, infrared, microwave", "Infrared, microwave, radio", "Microwave, radio, infrared"], "correct": 1, "explain": "Wavelength shrinks as you go from radio to microwave to infrared."}, {"text": "What does the metal mesh in a microwave oven's door do?", "choices": ["Makes the oven quieter", "Produces gamma rays", "Keeps the microwaves inside the oven", "Makes the food colder"], "correct": 3, "explain": "The holes in the mesh are much smaller than the microwave wavelength, so the waves cannot get through."}, {"text": "Which type of EM wave has wavelengths from about 1 mm to 1 m?", "choices": ["Visible light", "Radio waves", "X-rays", "Microwaves"], "correct": 4, "explain": "Microwaves cover the range between about 1 millimeter and 1 meter."}], "Infrared and Visible Light": [{"text": "We feel infrared radiation as...", "choices": ["Sound", "Color", "Heat", "Pressure"], "correct": 3, "explain": "Warm objects give off infrared, which our skin feels as heat."}, {"text": "Which device sends invisible infrared signals to change TV channels?", "choices": ["Speaker", "Remote control", "Microphone", "Battery charger"], "correct": 2, "explain": "A remote's infrared LED sends coded pulses that the TV detects."}, {"text": "Thermal cameras make pictures by detecting...", "choices": ["Gamma rays", "Infrared radiation", "Radio waves", "X-rays"], "correct": 2, "explain": "Warm objects glow in infrared, so thermal cameras can see them even in the dark."}, {"text": "Which is the only part of the EM spectrum that human eyes can see?", "choices": ["Infrared", "Ultraviolet", "Visible light", "Microwaves"], "correct": 3, "explain": "Our eyes only respond to a narrow band called visible light."}, {"text": "Which list shows visible light from longest to shortest wavelength?", "choices": ["Blue, green, red, orange, yellow, violet, indigo", "Violet, indigo, blue, green, yellow, orange, red", "Red, orange, green, yellow, blue, indigo, violet", "Red, orange, yellow, green, blue, indigo, violet"], "correct": 4, "explain": "Red has the longest wavelength and violet the shortest, which is the order of a rainbow."}, {"text": "Which color of visible light has the longest wavelength?", "choices": ["Blue", "Red", "Green", "Violet"], "correct": 2, "explain": "Red light is at the long-wavelength end of the visible spectrum."}, {"text": "Which color of visible light has the highest frequency and energy?", "choices": ["Orange", "Yellow", "Violet", "Red"], "correct": 3, "explain": "Violet is at the short-wavelength end, so it has the highest frequency and energy."}, {"text": "What does a prism show about white light?", "choices": ["It is a mixture of many colors", "It is made of sound", "It is invisible", "It is a single color"], "correct": 1, "explain": "A prism bends each color by a different amount, spreading white light into a rainbow."}, {"text": "About what wavelength range is visible light?", "choices": ["400 to 700 nm", "1 mm to 1 m", "0.01 to 10 nm", "10 to 400 nm"], "correct": 1, "explain": "Visible light runs from about 400 nanometers (violet) to 700 nanometers (red)."}, {"text": "Compared with visible light, infrared has a...", "choices": ["Shorter wavelength", "Exactly the same wavelength", "Higher frequency", "Longer wavelength"], "correct": 4, "explain": "Infrared sits just beyond red light, so its wavelength is longer than visible light's."}, {"text": "Heat lamps and toasters warm things mostly by giving off...", "choices": ["Ultraviolet rays", "X-rays", "Gamma rays", "Infrared radiation"], "correct": 4, "explain": "Hot objects like heater coils radiate infrared, which warms whatever absorbs it."}, {"text": "Fiber-optic cables carry internet data as pulses of...", "choices": ["Sound", "Water", "Gamma rays", "Light"], "correct": 4, "explain": "Fiber-optic cables send data as flashes of light along thin glass strands."}, {"text": "Plants use which part of the EM spectrum for photosynthesis?", "choices": ["Gamma rays", "Visible light", "X-rays", "Radio waves"], "correct": 2, "explain": "Plants absorb mostly red and blue visible light to make their food."}, {"text": "Why does a red shirt look red?", "choices": ["It makes its own red light", "It reflects red light and absorbs most other colors", "It absorbs red light and reflects the rest", "It gives off infrared only"], "correct": 2, "explain": "We see the colors an object reflects, and a red shirt reflects red light."}, {"text": "Which statement about infrared and visible light is TRUE?", "choices": ["Infrared has a higher frequency than visible light", "Infrared travels faster in a vacuum     }
    route();
  } else if (a === "again") { S.qz = { name: qz.name, list: shuffle(QUESTIONS[qz.name]).slice(0, 10), i: 0, score: 0, picked: 0 }; route(); }
  else if (a === "topics") { S.qz = null; route(); }
});
document.addEventListener("input", function (e) {
  if (e.target.id !== "slide") return;
  S.surf = +e.target.value - 1;
  var w = WAVES[S.surf];
  setWave(w.rgb, true);
  document.getElementById("sname").textContent = w.name;
  document.getElementById("sdesc").textContent = w.short;
  document.getElementById("learn").dataset.go = "wave-" + (S.surf + 1);
});
route();
syncMute();
if ("serviceWorker" in navigator) { /* no offline cache: keep it simple */ }
</script>
